services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: churn-backend
    environment:
      - APP_NAME=Customer Churn Prediction API
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # Processed splits for the dashboard — kept out of the image.
      - ./data/processed:/app/data/processed:ro
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: churn-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: churn-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root file:///mlflow/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      # Share the tracking store with local training runs.
      - ./mlruns:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
