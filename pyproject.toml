[project]
name = "customer-churn-prediction"
version = "2.0.0"
description = "End-to-end ML platform for customer churn prediction: training, MLOps, API and dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ouissal Nari" }]
keywords = [
    "machine-learning",
    "churn-prediction",
    "mlops",
    "fastapi",
    "shap",
    "mlflow",
    "dvc",
    "evidently",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
mlops = ["mlflow>=2.16", "dvc>=3.55", "pandera>=0.20", "evidently>=0.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "backend", "tests", "monitoring", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # FastAPI dependency injection in default arguments is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/*.py" = ["E402"]  # sys.path bootstrap before package imports

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src", "backend"]
omit = ["backend/app/main.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
